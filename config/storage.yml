# Where uploaded files live.
#
# Disk locally and in test, so nothing needs cloud credentials to run or to
# check out and work on. S3 in production, in a private bucket: files are
# reached only through short lived signed URLs minted per request, never
# through public links.
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Credentials come from Heroku config vars rather than Rails credentials, so
# the key can be rotated without a deploy. The IAM user behind these keys can
# reach this one bucket and nothing else.
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV["AWS_REGION"] %>
  bucket: <%= ENV["AWS_S3_BUCKET"] %>
